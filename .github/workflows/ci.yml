name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: [self-hosted, personal-mac]
    # The single-threaded unit suite takes 8-10 minutes on this Mac.
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci
        env:
          npm_config_cache: ${{ runner.temp }}/npm-cache

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test -- --reporter=dot

      - name: Production build
        run: npm run build:assets

      - name: Seed-only API compatibility smoke
        run: npm run test:seed

  browser-smoke:
    # verify and browser-smoke share this Mac and its PostgreSQL cluster; running
    # them together starves the unit tests' advisory-lock and connection timeouts.
    needs: verify
    runs-on: [self-hosted, personal-mac]
    timeout-minutes: 18
    env:
      DANAWA_CRAWL_ON_START: "false"
      BUILD_MONITOR_SCHEDULER_ENABLED: "false"
      NODE_ENV: test
      BROWSER_SMOKE_TIMEOUT_MS: "120000"
      BROWSER_SMOKE_EVALUATE_TIMEOUT_MS: "30000"
      # Dedicated loopback ports: a stale dev/preview server occupying the
      # default 5173/4174 ports would otherwise shadow this job's servers
      # (loopback binds win over wildcard binds on macOS) and make the smoke
      # silently test the wrong build.
      BROWSER_SMOKE_BASE_URL: "http://127.0.0.1:5273"
      # The admin CSRF/origin check allows POSTs only from same-origin or the
      # allowlist; the smoke's dedicated ports must be listed explicitly.
      CORS_ALLOWED_ORIGINS: "http://127.0.0.1:5273,http://127.0.0.1:4184"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci
        env:
          npm_config_cache: ${{ runner.temp }}/npm-cache

      - name: Provision scratch PostgreSQL
        shell: bash
        run: |
          node scripts/ci-embedded-postgres.mjs pcsupporter_browser_smoke "${RUNNER_TEMP}/pc-supporter-pg-url.txt" &
          for attempt in {1..90}; do
            if [ -s "${RUNNER_TEMP}/pc-supporter-pg-url.txt" ]; then break; fi
            sleep 1
          done
          if [ ! -s "${RUNNER_TEMP}/pc-supporter-pg-url.txt" ]; then
            echo "Embedded PostgreSQL did not become ready."
            exit 1
          fi
          echo "DATABASE_URL=$(cat "${RUNNER_TEMP}/pc-supporter-pg-url.txt")" >> "$GITHUB_ENV"

      - name: Prepare deterministic browser fixture
        env:
          PC_SUPPORTER_BROWSER_SMOKE_FIXTURE: "1"
        run: npx --no-install tsx scripts/prepare-browser-smoke-data.ts

      - name: Free smoke ports from stale processes
        run: |
          for port in 4274 5273; do
            pids=$(lsof -ti tcp:"$port" 2>/dev/null || true)
            if [ -n "$pids" ]; then
              echo "port $port held by stale process: $pids"
              echo "$pids" | xargs kill -9 2>/dev/null || true
            fi
          done
          sleep 1
          for port in 4274 5273; do
            if lsof -ti tcp:"$port" >/dev/null 2>&1; then
              echo "port $port is still in use after cleanup" >&2
              exit 1
            fi
          done

      - name: Start local web and API servers
        run: |
          SERVER_HOST=127.0.0.1 PORT=4274 PC_SUPPORTER_RATE_LIMIT_SCALE=50 npx --no-install tsx server/index.ts > "${RUNNER_TEMP}/pc-supporter-api.log" 2>&1 &
          api_pid=$!
          VITE_API_PROXY_TARGET="http://127.0.0.1:4274" npx --no-install vite --host 127.0.0.1 --port 5273 --strictPort > "${RUNNER_TEMP}/pc-supporter-dev.log" 2>&1 &
          web_pid=$!
          echo "$api_pid $web_pid" > "${RUNNER_TEMP}/pc-supporter-dev.pid"

      - name: Wait for local API
        shell: bash
        run: |
          read -r api_pid web_pid < "${RUNNER_TEMP}/pc-supporter-dev.pid"
          for attempt in {1..60}; do
            if ! kill -0 "$api_pid" 2>/dev/null || ! kill -0 "$web_pid" 2>/dev/null; then
              echo "A CI dev server process exited early; a stale server may already hold the port."
              cat "${RUNNER_TEMP}/pc-supporter-api.log" "${RUNNER_TEMP}/pc-supporter-dev.log"
              exit 1
            fi
            if curl --fail --silent http://127.0.0.1:5273/api/health > "${RUNNER_TEMP}/pc-supporter-health.json" \
              && curl --fail --silent http://127.0.0.1:5273/ | grep -q '/src/main.tsx'; then
              cat "${RUNNER_TEMP}/pc-supporter-health.json"
              exit 0
            fi
            sleep 1
          done
          cat "${RUNNER_TEMP}/pc-supporter-api.log" "${RUNNER_TEMP}/pc-supporter-dev.log"
          exit 1

      - name: Browser DOM smoke flow
        run: npm run test:browser

      - name: Guided quote onboarding smoke flow
        run: npm run test:browser:quote-onboarding

      - name: Build production preview
        env:
          NODE_ENV: production
        run: npm run build

      - name: Start production preview server
        env:
          VITE_API_PROXY_TARGET: http://127.0.0.1:4274
        run: npm run preview -- --host 127.0.0.1 --port 4184 --strictPort > "${RUNNER_TEMP}/pc-supporter-preview.log" 2>&1 &

      - name: Wait for production preview API proxy
        shell: bash
        run: |
          for attempt in {1..60}; do
            if curl --fail --silent http://127.0.0.1:4184/api/health > "${RUNNER_TEMP}/pc-supporter-preview-health.json" \
              && curl --fail --silent http://127.0.0.1:4184/ | grep -q '/assets/'; then
              cat "${RUNNER_TEMP}/pc-supporter-preview-health.json"
              exit 0
            fi
            sleep 1
          done
          cat "${RUNNER_TEMP}/pc-supporter-preview.log"
          exit 1

      - name: Production preview browser DOM smoke flow
        env:
          BROWSER_SMOKE_BASE_URL: http://127.0.0.1:4184
        run: npm run test:browser

      - name: Production preview guided quote onboarding smoke flow
        env:
          BROWSER_SMOKE_BASE_URL: http://127.0.0.1:4184
        run: npm run test:browser:quote-onboarding

      - name: Browser persistence smoke flow
        run: npm run test:browser:persistence

      - name: Upload browser smoke server log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: pc-supporter-browser-smoke-log
          path: |
            ${{ runner.temp }}/pc-supporter-dev.log
            ${{ runner.temp }}/pc-supporter-api.log
            ${{ runner.temp }}/pc-supporter-pg.log
            ${{ runner.temp }}/pc-supporter-preview.log

  container-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      COMPOSE_PROJECT_NAME: pc-supporter-ci-${{ github.run_id }}-${{ github.run_attempt }}
      COMPOSE_PROFILES: container-smoke
      PRICE_REFRESH_SCHEDULER_ENABLED: "false"
      BUILD_MONITOR_SCHEDULER_ENABLED: "false"
      POSTGRES_OWNER_PASSWORD: pc-supporter-ci-only-schema-owner-password-not-for-deployment
      POSTGRES_RUNTIME_ROLE: pcsupporter_runtime_ci
      POSTGRES_RUNTIME_PASSWORD: pc-supporter-ci-only-runtime-password-not-for-deployment
      RATE_LIMIT_HMAC_SECRET: pc-supporter-ci-only-rate-limit-secret-not-for-deployment
      ADMIN_PASSWORD: pc-supporter-ci-only-admin-password-not-for-deployment
      ADMIN_SESSION_SECRET: pc-supporter-ci-only-admin-session-secret-not-for-deployment
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies for host-side PostgreSQL smoke scripts
        run: npm ci

      - name: Choose per-run loopback ports
        shell: bash
        run: |
          port_suffix="$(printf '%s-%s' "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" | cksum | awk '{ print $1 % 10000 }')"
          app_port=$((30000 + port_suffix))
          postgres_port=$((40000 + port_suffix))
          {
            echo "APP_HOST_PORT=$app_port"
            echo "POSTGRES_HOST_PORT=$postgres_port"
            echo "PC_SUPPORTER_API_BASE_URL=http://127.0.0.1:$app_port"
          } >> "$GITHUB_ENV"

      - name: Build and start production compose stack
        run: docker compose up --build --detach

      - name: Wait for production API
        shell: bash
        run: |
          for attempt in {1..90}; do
            if curl --fail --silent "${PC_SUPPORTER_API_BASE_URL}/api/health" > "${RUNNER_TEMP}/pc-supporter-container-health.json"; then
              cat "${RUNNER_TEMP}/pc-supporter-container-health.json"
              exit 0
            fi
            sleep 1
          done
          docker compose ps
          docker compose logs --no-color app api-reader worker postgres migrate runtime-role-bootstrap
          exit 1

      - name: Verify production metadata route
        run: curl --fail --silent "$PC_SUPPORTER_API_BASE_URL/api/meta" > /dev/null

      - name: Verify PostgreSQL runtime role DML and denied DDL/ledger writes
        run: docker compose exec -T app node scripts/postgres-runtime-role-smoke.mjs

      - name: Verify PostgreSQL comparison persistence round-trip
        run: npm run test:postgres:comparison

      - name: Verify PostgreSQL saved build state round-trip
        run: npm run test:postgres:saved-build

      - name: Wait for the isolated API replica and worker heartbeat
        shell: bash
        run: |
          for attempt in {1..90}; do
            if docker compose exec -T app node -e "fetch('http://api-reader:4174/api/health').then((r)=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))" \
              && docker compose exec -T app node -e "const fs=require('node:fs');try{const h=JSON.parse(fs.readFileSync('/app/data/.price-refresh-worker-health.json','utf8'));const t=Date.parse(h.lastDatabaseSuccessAt);if(h.service!=='pc-supporter-price-refresh-worker'||!Number.isFinite(t)||Date.now()-t>45000)process.exit(1)}catch{process.exit(1)}"; then
              exit 0
            fi
            sleep 1
          done
          docker compose ps
          docker compose logs --no-color app api-reader worker postgres migrate runtime-role-bootstrap
          exit 1

      - name: Verify PostgreSQL durable price-refresh API and worker flow
        run: docker compose exec -T app env PC_SUPPORTER_PRICE_REFRESH_SMOKE_PHASE=api-worker npm run test:postgres:price-refresh

      - name: Kill a queue-worker child during a synthetic handler and verify lease recovery
        run: |
          docker compose stop worker
          docker compose exec -T app env PC_SUPPORTER_PRICE_REFRESH_SMOKE_PHASE=recovery npm run test:postgres:price-refresh

      - name: Stop production compose stack
        if: always()
        run: docker compose down --volumes --remove-orphans

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [verify, browser-smoke, container-smoke]
    # 운영은 Azure VM이다(Lightsail은 공개 주소를 Azure로 넘기는 프록시). Azure SSH는
    # NSG AdminSSH에 등록된 IP만 허용하므로, 등록된 이 Mac 러너에서 로컬 배포 키로 올린다.
    # 키와 고정 host key는 러너 사용자의 ~/.ssh에만 두고 GitHub secret으로 올리지 않는다.
    runs-on: [self-hosted, personal-mac]
    timeout-minutes: 25
    env:
      PC_SUPPORTER_AZURE_HOST: pc-supporter-71697d83-kc.koreacentral.cloudapp.azure.com
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci
        env:
          npm_config_cache: ${{ runner.temp }}/npm-cache

      - name: Production build
        run: npm run build:assets

      - name: Deploy to Azure production VM
        run: |
          test -f "$HOME/.ssh/pc-supporter-azure" || { echo "::error::Missing ~/.ssh/pc-supporter-azure on the runner"; exit 1; }
          test -f "$HOME/.ssh/pc-supporter-azure-known-hosts" || { echo "::error::Missing pinned Azure host keys on the runner"; exit 1; }
          PC_SUPPORTER_SSH_KNOWN_HOSTS="$HOME/.ssh/pc-supporter-azure-known-hosts" ./scripts/lightsail-deploy.sh \
            --host "azureadmin@$PC_SUPPORTER_AZURE_HOST" \
            --domain "$PC_SUPPORTER_AZURE_HOST" \
            --ssh-key "$HOME/.ssh/pc-supporter-azure" \
            --preserve-env

      - name: Check the public address serves this release
        run: |
          expected="$(grep -oE 'index-[A-Za-z0-9_-]+\.js' dist/index.html | head -1)"
          served="$(curl -fsS https://pc-supporter.3-39-79-1.sslip.io/ | grep -oE 'index-[A-Za-z0-9_-]+\.js' | head -1)"
          echo "expected=$expected served=$served"
          test -n "$expected" && test "$expected" = "$served"
