name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: [self-hosted, personal-mac]
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test -- --reporter=dot

      - name: Production build
        run: npm run build

      - name: Seed-only API compatibility smoke
        run: npm run test:seed

  browser-smoke:
    runs-on: [self-hosted, personal-mac]
    timeout-minutes: 10
    env:
      DANAWA_CRAWL_ON_START: "false"
      BUILD_MONITOR_SCHEDULER_ENABLED: "false"
      NODE_ENV: test
      BROWSER_SMOKE_TIMEOUT_MS: "120000"
      BROWSER_SMOKE_EVALUATE_TIMEOUT_MS: "30000"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Prepare deterministic browser fixture
        env:
          PC_SUPPORTER_BROWSER_SMOKE_FIXTURE: "1"
        run: npx --no-install tsx scripts/prepare-browser-smoke-data.ts

      - name: Start local web and API servers
        run: |
          npm run dev > "${RUNNER_TEMP}/pc-supporter-dev.log" 2>&1 &
          echo $! > "${RUNNER_TEMP}/pc-supporter-dev.pid"

      - name: Wait for local API
        shell: bash
        run: |
          for attempt in {1..60}; do
            if curl --fail --silent http://127.0.0.1:5173/api/health > "${RUNNER_TEMP}/pc-supporter-health.json"; then
              cat "${RUNNER_TEMP}/pc-supporter-health.json"
              exit 0
            fi
            sleep 1
          done
          cat "${RUNNER_TEMP}/pc-supporter-dev.log"
          exit 1

      - name: Browser DOM smoke flow
        run: npm run test:browser

      - name: Guided quote onboarding smoke flow
        run: npm run test:browser:quote-onboarding

      - name: Build production preview
        env:
          NODE_ENV: production
        run: npm run build

      - name: Start production preview server
        run: npm run preview -- --port 4184 > "${RUNNER_TEMP}/pc-supporter-preview.log" 2>&1 &

      - name: Wait for production preview API proxy
        shell: bash
        run: |
          for attempt in {1..60}; do
            if curl --fail --silent http://127.0.0.1:4184/api/health > "${RUNNER_TEMP}/pc-supporter-preview-health.json"; then
              cat "${RUNNER_TEMP}/pc-supporter-preview-health.json"
              exit 0
            fi
            sleep 1
          done
          cat "${RUNNER_TEMP}/pc-supporter-preview.log"
          exit 1

      - name: Production preview browser DOM smoke flow
        env:
          BROWSER_SMOKE_BASE_URL: http://127.0.0.1:4184
        run: npm run test:browser

      - name: Production preview guided quote onboarding smoke flow
        env:
          BROWSER_SMOKE_BASE_URL: http://127.0.0.1:4184
        run: npm run test:browser:quote-onboarding

      - name: Browser persistence smoke flow
        run: npm run test:browser:persistence

      - name: Upload browser smoke server log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: pc-supporter-browser-smoke-log
          path: |
            ${{ runner.temp }}/pc-supporter-dev.log
            ${{ runner.temp }}/pc-supporter-preview.log

  container-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      COMPOSE_PROJECT_NAME: pc-supporter-ci-${{ github.run_id }}-${{ github.run_attempt }}
      COMPOSE_PROFILES: container-smoke
      PRICE_REFRESH_SCHEDULER_ENABLED: "false"
      BUILD_MONITOR_SCHEDULER_ENABLED: "false"
      POSTGRES_OWNER_PASSWORD: pc-supporter-ci-only-schema-owner-password-not-for-deployment
      POSTGRES_RUNTIME_ROLE: pcsupporter_runtime_ci
      POSTGRES_RUNTIME_PASSWORD: pc-supporter-ci-only-runtime-password-not-for-deployment
      RATE_LIMIT_HMAC_SECRET: pc-supporter-ci-only-rate-limit-secret-not-for-deployment
      ADMIN_PASSWORD: pc-supporter-ci-only-admin-password-not-for-deployment
      ADMIN_SESSION_SECRET: pc-supporter-ci-only-admin-session-secret-not-for-deployment
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies for host-side PostgreSQL smoke scripts
        run: npm ci

      - name: Choose per-run loopback ports
        shell: bash
        run: |
          port_suffix="$(printf '%s-%s' "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" | cksum | awk '{ print $1 % 10000 }')"
          app_port=$((30000 + port_suffix))
          postgres_port=$((40000 + port_suffix))
          {
            echo "APP_HOST_PORT=$app_port"
            echo "POSTGRES_HOST_PORT=$postgres_port"
            echo "PC_SUPPORTER_API_BASE_URL=http://127.0.0.1:$app_port"
          } >> "$GITHUB_ENV"

      - name: Build and start production compose stack
        run: docker compose up --build --detach

      - name: Wait for production API
        shell: bash
        run: |
          for attempt in {1..90}; do
            if curl --fail --silent "${PC_SUPPORTER_API_BASE_URL}/api/health" > "${RUNNER_TEMP}/pc-supporter-container-health.json"; then
              cat "${RUNNER_TEMP}/pc-supporter-container-health.json"
              exit 0
            fi
            sleep 1
          done
          docker compose ps
          docker compose logs --no-color app api-reader worker postgres migrate runtime-role-bootstrap
          exit 1

      - name: Verify production metadata route
        run: curl --fail --silent "$PC_SUPPORTER_API_BASE_URL/api/meta" > /dev/null

      - name: Verify PostgreSQL runtime role DML and denied DDL/ledger writes
        run: docker compose exec -T app node scripts/postgres-runtime-role-smoke.mjs

      - name: Verify PostgreSQL comparison persistence round-trip
        run: npm run test:postgres:comparison

      - name: Verify PostgreSQL saved build state round-trip
        run: npm run test:postgres:saved-build

      - name: Wait for the isolated API replica and worker heartbeat
        shell: bash
        run: |
          for attempt in {1..90}; do
            if docker compose exec -T app node -e "fetch('http://api-reader:4174/api/health').then((r)=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))" \
              && docker compose exec -T app node -e "const fs=require('node:fs');try{const h=JSON.parse(fs.readFileSync('/app/data/.price-refresh-worker-health.json','utf8'));const t=Date.parse(h.lastDatabaseSuccessAt);if(h.service!=='pc-supporter-price-refresh-worker'||!Number.isFinite(t)||Date.now()-t>45000)process.exit(1)}catch{process.exit(1)}"; then
              exit 0
            fi
            sleep 1
          done
          docker compose ps
          docker compose logs --no-color app api-reader worker postgres migrate runtime-role-bootstrap
          exit 1

      - name: Verify PostgreSQL durable price-refresh API and worker flow
        run: docker compose exec -T app env PC_SUPPORTER_PRICE_REFRESH_SMOKE_PHASE=api-worker npm run test:postgres:price-refresh

      - name: Kill a queue-worker child during a synthetic handler and verify lease recovery
        run: |
          docker compose stop worker
          docker compose exec -T app env PC_SUPPORTER_PRICE_REFRESH_SMOKE_PHASE=recovery npm run test:postgres:price-refresh

      - name: Stop production compose stack
        if: always()
        run: docker compose down --volumes --remove-orphans
